name: Plate
options:
  bundleIdPrefix: com.dunebru
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Plate:
    type: application
    platform: iOS
    sources:
      - path: Plate
    entitlements:
      path: Plate/Plate.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Plate/Info.plist
      properties:
        CFBundleDisplayName: Plate
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Plate uses the camera to photograph meals and scan barcodes and nutrition labels.
        NSPhotoLibraryUsageDescription: Plate can analyze a meal photo from your library.
        NSHealthShareUsageDescription: Plate reads your weight, steps, and active energy from Apple Health to keep your targets accurate.
        NSHealthUpdateUsageDescription: Plate writes the calories, protein, carbs, fat, fiber, sugar, sodium, and weight you log to Apple Health.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dunebru.plate
        PRODUCT_NAME: Plate
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  PlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlateTests
    dependencies:
      - target: Plate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dunebru.plate.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Plate:
    build:
      targets:
        Plate: all
        PlateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PlateTests]
    archive:
      config: Release
